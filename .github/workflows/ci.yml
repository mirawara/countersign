name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, compile and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      # Mock-only: the suite never sends a provider request and needs no credentials.
      - run: npm test

  package:
    name: Packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Proves the package builds. The artefact is deliberately not uploaded: a VSIX bundles
      # @anthropic-ai/claude-agent-sdk, which grants no redistribution, and workflow artefacts
      # of a public repository are downloadable by anyone. See docs/third-party-accounts.md.
      - run: npm run package
      - run: rm -f ./*.vsix
